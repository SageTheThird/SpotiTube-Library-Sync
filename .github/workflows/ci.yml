name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile \
            main.py \
            main-spot-to-yt.py \
            web/extension/server.py \
            legacy/beat-bridge.py \
            scripts/migrate_cache_layout.py \
            beatbridge/*.py

      - name: Docker build
        run: docker build -t beatbridge-sync:ci .
